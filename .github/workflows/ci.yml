name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compile managed projects
        run: dotnet build src/tests/Eve-O-Preview.Tests/Eve-O-Preview.Tests.csproj -c Debug -p:EnableWindowsTargeting=true -p:UsedAvaloniaProducts=
